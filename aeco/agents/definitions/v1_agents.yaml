agents:
  - agent_id: coo_orchestrator
    name: COO Orchestrator
    role: orchestrator
    system_prompt_path: aeco/agents/prompts/coo_orchestrator.md
    executor: claude_code
    claude_code_config:
      max_turns: 5
      timeout_seconds: 120
      allowed_tools:
        - Read
        - Glob
        - Grep
    llm_config:
      provider: openrouter
      model: anthropic/claude-sonnet-4
      temperature: 0.3
      max_tokens: 2048
    tools:
      - clickup_read_task
      - clickup_update_task
      - clickup_create_comment
    permissions:
      - clickup:read
      - clickup:write

  - agent_id: chief_architect
