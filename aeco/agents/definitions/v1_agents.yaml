agents:
  - agent_id: coo_orchestrator
    name: COO Orchestrator
    role: orchestrator
    system_prompt_path: aeco/agents/prompts/coo_orchestrator.md
    llm_config:
      provider: anthropic
      model: claude-sonnet-4-20250514
      temperature: 0.3
      max_tokens: 2048
    tools:
      - clickup_read_task
      - clickup_update_task
      - clickup_create_comment
    permissions:
      - clickup:read
      - clickup:write

  - agent_id: chief_architect
    name: Chief Architect
    role: architect
    system_prompt_path: aeco/agents/prompts/chief_architect.md
    llm_config:
      provider: anthropic
      model: claude-sonnet-4-20250514
      temperature: 0.5
      max_tokens: 4096
    tools:
      - clickup_read_task
      - clickup_create_comment
      - file_write
      - file_read
    permissions:
      - clickup:read
      - clickup:comment
      - workspace:write
      - workspace:read

  - agent_id: backend_engineer
    name: Backend Engineer
    role: engineer
    system_prompt_path: aeco/agents/prompts/backend_engineer.md
    llm_config:
      provider: anthropic
      model: claude-sonnet-4-20250514
      temperature: 0.4
      max_tokens: 8192
    tools:
      - clickup_read_task
      - clickup_create_comment
      - file_write
      - file_read
    permissions:
      - clickup:read
      - clickup:comment
      - workspace:write
      - workspace:read

  - agent_id: qa_engineer
    name: QA Engineer
    role: qa
    system_prompt_path: aeco/agents/prompts/qa_engineer.md
    llm_config:
      provider: anthropic
      model: claude-sonnet-4-20250514
      temperature: 0.2
      max_tokens: 4096
    tools:
      - clickup_read_task
      - clickup_create_comment
      - file_read
      - code_execute
    permissions:
      - clickup:read
      - clickup:comment
      - workspace:read
      - code:execute
