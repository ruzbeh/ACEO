services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aeco
      POSTGRES_PASSWORD: aeco
      POSTGRES_DB: aeco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma

volumes:
  pgdata:
  chromadata:
